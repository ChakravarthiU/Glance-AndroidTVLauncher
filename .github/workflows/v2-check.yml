# Checks a branch before it is merged: runs the V2 unit tests and builds an unsigned release APK (with R8), so a
# change that doesn't compile or breaks a test is caught before it reaches main. Uses no secrets; the signed APK
# for the TV comes only from the "V2 release" workflow on main. Compiler errors and failed tests are also shown as
# annotations on the run's summary page.
name: V2 check

on:
  push:
    branches-ignore: [main]
    paths:
      - '**'
      - '!design/**'
      - '!**/*.md'
      - '.github/workflows/v2-check.yml'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build (unsigned)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon test assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Show errors as annotations
        if: failure()
        run: |
          grep -E "error:|FAILED|Exception|warning: \[" "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
