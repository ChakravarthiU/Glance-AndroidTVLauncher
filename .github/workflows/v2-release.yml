# Builds TV Home V2 as a signed release APK and publishes it as tvhome-v2.apk on the rolling GitHub
# Release "v2-latest" (replaced by each build). A Release, not an Actions artifact: release files don't count against
# the account's Actions storage quota.
# Signing key: GitHub Secrets V2_KEYSTORE_BASE64, V2_KEYSTORE_PASSWORD, V2_KEY_ALIAS, V2_KEY_PASSWORD, made once
# with Scripts/Setup-Signing.ps1. Every build uses that one key, so it installs over the last (adb install -r).
name: V2 release

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!design/**'
      - '!**/*.md'
      - '.github/workflows/v2-release.yml'
  workflow_dispatch:

permissions:
  contents: write   # to replace the v2-latest release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack the signing key
        env:
          V2_KEYSTORE_BASE64: ${{ secrets.V2_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$V2_KEYSTORE_BASE64" ]; then
            echo "::error::No signing key in GitHub Secrets. Run Scripts/Setup-Signing.ps1 once, then run this workflow again."
            exit 1
          fi
          echo "$V2_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test and build
        env:
          V2_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          V2_KEYSTORE_PASSWORD: ${{ secrets.V2_KEYSTORE_PASSWORD }}
          V2_KEY_ALIAS: ${{ secrets.V2_KEY_ALIAS }}
          V2_KEY_PASSWORD: ${{ secrets.V2_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test assembleRelease
      - name: Check the APK is signed with the release key
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No signed app-release.apk (signing did not run)"; exit 1; }
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk" | head -3
      - name: Publish on the v2-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/tvhome-v2.apk"
          gh release delete v2-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create v2-latest "$RUNNER_TEMP/tvhome-v2.apk" --target "$GITHUB_SHA" --latest \
            --title "TV Home V2 (latest build)" \
            --notes "Commit ${GITHUB_SHA::7}: $(git log -1 --format=%s), run $GITHUB_RUN_NUMBER. Install with Scripts/Install-Package.ps1, or download tvhome-v2.apk and run: adb install -r tvhome-v2.apk"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
