<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;width:1200px;height:340px;overflow:hidden}</style></head><body>
<!-- Still art of the Diwali banner, in the 1200x340 banner template. Flames, glows, sparkles and text are NOT here:
     they are animated vector layers / replaceable text in the Lottie file. -->
<svg id="s" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9f1239"/><stop offset=".55" stop-color="#7f1d1d"/><stop offset="1" stop-color="#5b0f1f"/></linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b7791f"/><stop offset=".5" stop-color="#ffe08a"/><stop offset="1" stop-color="#b7791f"/></linearGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="30" cy="30" r="3" fill="rgba(255,209,102,.18)"/><circle cx="0" cy="0" r="2" fill="rgba(255,209,102,.12)"/><circle cx="60" cy="0" r="2" fill="rgba(255,209,102,.12)"/><circle cx="0" cy="60" r="2" fill="rgba(255,209,102,.12)"/><circle cx="60" cy="60" r="2" fill="rgba(255,209,102,.12)"/></pattern>
  </defs>
  <g id="g" transform="translate(-360,-230)">
    <path d="M560 250 L600 300 M1360 250 L1320 300" stroke="#e8c27a" stroke-width="2.5"/>
    <path id="cl" fill="url(#cloth)"/><path id="clp" fill="url(#dots)"/><path id="clb" fill="none" stroke="url(#goldH)" stroke-width="5"/>
    <rect x="566" y="340" width="788" height="128" rx="10" fill="none" stroke="rgba(255,209,102,.55)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <g id="tassels"></g><g id="toran"></g><g id="diyas"></g>
  </g>
</svg>
<script>
const ns = 'http://www.w3.org/2000/svg';
function el(p, t, a) { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }
(function () {
  const x0 = 550, x1 = 1370, y0 = 300, y1 = 486, n = 14, w = (x1 - x0) / n;
  let d = `M${x0} ${y0} L${x1} ${y0} L${x1} ${y1}`;
  for (let i = n; i > 0; i--) { const a = x0 + i * w, b = a - w; d += ` Q${(a + b) / 2} ${y1 + 26} ${b} ${y1}`; }
  d += ' Z';
  for (const id of ['cl', 'clp', 'clb']) document.getElementById(id).setAttribute('d', d);
  const t = document.getElementById('tassels');
  for (let i = 0; i < n; i++) {
    const cx = x0 + (i + .5) * w, cy = y1 + 13;
    el(t, 'line', { x1: cx, y1: cy, x2: cx, y2: cy + 16, stroke: '#e8c27a', 'stroke-width': 2 });
    el(t, 'path', { d: `M${cx - 7} ${cy + 30} Q${cx} ${cy + 10} ${cx + 7} ${cy + 30} Z`, fill: 'url(#goldH)' });
    el(t, 'circle', { cx, cy: cy + 31, r: 3, fill: '#ffd166' });
  }
})();
function marigold(g, cx, cy, r, outer, inner) {
  for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; el(g, 'circle', { cx: cx + Math.cos(a) * r * .55, cy: cy + Math.sin(a) * r * .55, r: r * .5, fill: outer }); }
  for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2 + .3; el(g, 'circle', { cx: cx + Math.cos(a) * r * .28, cy: cy + Math.sin(a) * r * .28, r: r * .36, fill: inner }); }
  el(g, 'circle', { cx, cy, r: r * .18, fill: '#b45309' });
}
(function () {
  const g = document.getElementById('toran');
  const pts = [[530, 300], [690, 300], [850, 300], [1010, 300], [1170, 300], [1390, 300]];
  const cols = [['#f97316', '#fbbf24'], ['#facc15', '#fde68a'], ['#ea580c', '#f59e0b']];
  let c = 0;
  for (let s = 0; s < pts.length - 1; s++) {
    const [ax, ay] = pts[s], [bx, by] = pts[s + 1], mx = (ax + bx) / 2, sag = 22;
    for (let i = 0; i <= 9; i++) {
      const t = i / 9, x = (1 - t) * (1 - t) * ax + 2 * (1 - t) * t * mx + t * t * bx;
      const y = (1 - t) * (1 - t) * ay + 2 * (1 - t) * t * (ay + sag) + t * t * by;
      const [o, n] = cols[c++ % 3]; marigold(g, x, y, 15, o, n);
    }
  }
  for (const [x, y] of pts) {
    el(g, 'path', { d: `M${x - 4} ${y} Q${x - 22} ${y + 22} ${x - 6} ${y + 40} Q${x + 2} ${y + 20} ${x - 4} ${y}Z`, fill: '#15803d' });
    el(g, 'path', { d: `M${x + 4} ${y} Q${x + 22} ${y + 22} ${x + 6} ${y + 40} Q${x - 2} ${y + 20} ${x + 4} ${y}Z`, fill: '#16a34a' });
    marigold(g, x, y, 19, '#dc2626', '#f97316');
  }
})();
// Diya bowls only (the flame and its glow are animated in the Lottie)
function bowl(g, cx, cy) {
  el(g, 'path', { d: `M${cx - 46} ${cy} Q${cx} ${cy + 46} ${cx + 46} ${cy} Q${cx + 34} ${cy - 6} ${cx + 30} ${cy - 14} L${cx - 30} ${cy - 14} Q${cx - 34} ${cy - 6} ${cx - 46} ${cy}Z`, fill: '#c2410c' });
  el(g, 'path', { d: `M${cx - 40} ${cy + 2} Q${cx} ${cy + 36} ${cx + 40} ${cy + 2}`, stroke: '#fbbf24', 'stroke-width': 3, fill: 'none' });
  el(g, 'ellipse', { cx, cy: cy - 12, rx: 30, ry: 6, fill: '#7c2d12' });
  el(g, 'path', { d: `M${cx - 2} ${cy - 13} L${cx - 2} ${cy - 20} L${cx + 2} ${cy - 20} L${cx + 2} ${cy - 13}Z`, fill: '#3f1d0b' });
}
const dg = document.getElementById('diyas');
bowl(dg, 465, 490); bowl(dg, 1455, 490);
</script></body></html>
